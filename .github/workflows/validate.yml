name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validator tests
        run: npm test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust registry and adapters
        run: cargo test --workspace

      - name: Generate and verify the Rust registry example
        run: |
          npm run generate:rust-example
          node bin/action-parity.mjs verify examples/rust-registry/generated/action-parity.json --out artifacts/rust-registry-evidence.json

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Validate examples
        run: npm run validate

      - name: Check documentation links
        run: npm run check:links

